name: Tests
on: [push, pull_request]
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
      - run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - run: uv sync --locked --python 3.12 --extra dev --extra references --extra figures
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync pytest -q
