[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghist-bottleneck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pandas",
  "joblib",
  "msprime",
  "tskit",
  "pysam",
  "pyyaml",
  "torch",
  "tqdm",
  "synapseclient",
]

[project.optional-dependencies]
references = ["moments-popgen", "dadi", "scikit-allel", "h5py"]
genealogy = ["tsinfer", "tsdate", "bio2zarr"]
figures = ["matplotlib"]
simulation = ["stdpopsim"]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
